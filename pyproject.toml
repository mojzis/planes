[project]
name = "planes"
version = "0.1.0"
description = "Original paper planes for kids: step pages and printable PDFs"
requires-python = ">=3.11"
dependencies = [
    "deedum",
    "markupsafe>=3.0.4",
    "playwright>=1.65.2",
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planes"]

[dependency-groups]
dev = [
    # aesop toolbox
    "madoqua",
    "gerenuk",
    "biston",
    "zorilla",
    "pycoati",
    "ty-find",
    "dermestes",
    # core
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "vulture",
    "deptry",
    "interrogate",
    "poethepoet",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "C4", "DTZ", "T20", "PTH", "ERA", "PL", "TRY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# The fold model and its renderers are geometry code: coordinates as positional
# arguments, short math names, literal millimetres, and long step texts.
"planes/{fold,iso,render,models,sheets,catalogue,build}.py" = ["PLR2004", "PLR0913", "PLR0917", "E731", "C408", "E501"]

[tool.ruff.format]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=planes --cov-report=term-missing"

[tool.coverage.run]
source = ["planes"]

[tool.coverage.report]
show_missing = true

[tool.vulture]
paths = ["planes", "site"]
# Used by deedum (hooks) and the Jinja templates, which vulture cannot see.
ignore_names = ["PlanesApp", "context", "globals", "after_build", "scissors"]

[tool.deptry]

[tool.interrogate]
fail_under = 0

[tool.madoqua]
# fix phase keeps the defaults: ruff check --fix, ruff format (re-staged).
# check phase keeps the defaults (ruff check, ty check) and adds:
extend_check = [
    # madoqua appends the staged .py files. biston reads them as --focus-args focus files
    # (only clone pairs touching a staged file); zorilla lints exactly those files.
    # full_cmd is what `madoqua check` (and so `poe check`) runs on the whole repo instead.
    { name = "biston", cmd = "biston scan --focus-args", full_cmd = "biston scan .", timeout_s = 60, max_output_lines = 80 },
    { name = "zorilla", cmd = "zorilla check", timeout_s = 30, max_output_lines = 80 },
    # gerenuk scopes itself from the git diff, so no file list.
    # -o addopts= drops the --cov from [tool.pytest.ini_options]; the hook never reads coverage.
    { name = "gerenuk", cmd = "gerenuk run -- -q -o addopts=", pass_files = false, when = "commit", timeout_s = 120, max_output_lines = 120 },
    # `madoqua check` only: the full suite instead of gerenuk's selection, and a
    # non-blocking dependency vulnerability scan.
    { name = "pytest", cmd = "pytest -q --tb=short", pass_files = false, when = "full" },
    { name = "pysentry", cmd = "uvx pysentry-rs .", pass_files = false, when = "full", blocking = false },
]

[tool.dermestes]

[tool.biston.scan]
exclude = ["**/tests/**"]

[tool.poe]
verbosity = -1

[tool.poe.tasks.fix]
sequence = [
    { cmd = "ruff format --quiet ." },
    { cmd = "ruff check --fix --quiet ." },
]
help = "Auto-fix: format and lint"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "Run linter (no fix)"

[tool.poe.tasks.typecheck]
cmd = "ty check"
help = "Run type checker"

[tool.poe.tasks.test]
cmd = "pytest -q --tb=short"
help = "Run tests"

[tool.poe.tasks.vulns]
shell = "uvx pysentry-rs . || true"
interpreter = "bash"
help = "Dependency vulnerability scan"

[tool.poe.tasks.test-lint]
cmd = "zorilla check ."
help = "Lint tests for smells (zorilla)"

[tool.poe.tasks.clones]
cmd = "biston scan ."
help = "Clone detection (biston)"

[tool.poe.tasks.dead-code]
cmd = "vulture planes site"
help = "Dead code detection"

[tool.poe.tasks.abstractions]
cmd = "dermestes --all"
help = "Single-use abstractions (dermestes)"

[tool.poe.tasks.unused-deps]
cmd = "deptry ."
help = "Unused dependency check"

[tool.poe.tasks.check]
cmd = "madoqua check"
help = "Run all checks on the whole repo (madoqua check)"

[tool.poe.tasks.check-all]
sequence = [
    { ref = "lint" },
    { ref = "typecheck" },
    { ref = "vulns" },
    { ref = "test-lint" },
    { ref = "clones" },
    { ref = "dead-code" },
    { ref = "abstractions" },
    { ref = "unused-deps" },
    { ref = "test" },
]
ignore_fail = "return_non_zero"
help = "Run all checks (report all failures)"

[tool.poe.tasks.site]
cmd = "deedum build --check --config site/deedum.toml"
help = "Build the site and the PDFs into _site/, then lint it"

[tool.poe.tasks.serve]
cmd = "deedum serve --config site/deedum.toml"
env = { PLANES_PDF = "0" }
help = "Serve the site locally with live rebuilds (no PDFs)"

[tool.poe.tasks.setup]
cmd = "madoqua install"
help = "Install the madoqua commit hook (sets core.hooksPath)"

[tool.uv.sources]
deedum = { git = "https://github.com/mojzis/deedum" }
